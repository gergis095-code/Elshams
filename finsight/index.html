<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FinSight — financial input review</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F1729; --ink-2:#1D2939; --body:#344054; --muted:#667085; --faint:#98A2B3;
  --line:#E4E7EC; --line-2:#D0D5DD; --page:#F7F8FA; --card:#FFFFFF; --rail:#0F1729;
  --accent:#145C9E; --accent-soft:#EAF2FB;
  --crit:#B42318; --crit-bg:#FEF3F2; --crit-line:#FECDCA;
  --warn:#B54708; --warn-bg:#FFFAEB; --warn-line:#FEDF89;
  --ok:#067647;   --ok-bg:#ECFDF3;   --ok-line:#ABEFC6;
  --info:#175CD3; --info-bg:#EFF8FF;
  --r:6px;
}
[data-theme="dark"]{
  --ink:#F2F4F7; --ink-2:#E4E7EC; --body:#CDD3DC; --muted:#98A2B3; --faint:#667085;
  --line:#28303E; --line-2:#3A4454; --page:#0B111C; --card:#131A26; --rail:#080D16;
  --accent:#5B9BE0; --accent-soft:#16283C;
  --crit:#FDA29B; --crit-bg:#2A1516; --crit-line:#5B2120;
  --warn:#FEC84B; --warn-bg:#291D08; --warn-line:#5A4008;
  --ok:#6CE9A6;   --ok-bg:#0A2119;   --ok-line:#1A4231;
  --info:#84CAFF; --info-bg:#0E2136;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif;
  background:var(--page); color:var(--body); font-size:14px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
html[dir="rtl"] body{font-family:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{color:var(--ink);font-weight:600;letter-spacing:-.01em}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:216px 1fr;min-height:100vh}
html[dir="rtl"] .app{grid-template-columns:216px 1fr}
@media(max-width:860px){.app{grid-template-columns:1fr}.rail{display:none}}

.rail{background:var(--rail);color:#fff;padding:18px 0;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:0 18px 20px}
.brand-mark{width:30px;height:30px;flex:none;border-radius:5px;background:var(--accent);
  display:grid;place-items:center;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:13px;color:#fff}
.brand-name{font-size:15px;font-weight:600;letter-spacing:-.01em;color:#fff;line-height:1.1}
.brand-sub{font-size:10.5px;color:rgba(255,255,255,.5);letter-spacing:.04em}
.nav{display:flex;flex-direction:column;gap:1px;padding:0 8px}
.nav button{
  display:flex;align-items:center;gap:9px;width:100%;text-align:start;
  padding:9px 11px;border:none;border-radius:var(--r);background:transparent;
  color:rgba(255,255,255,.68);cursor:pointer;font-size:13.5px;transition:.12s;
}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.on{background:rgba(255,255,255,.11);color:#fff;font-weight:500}
.nav .badge{margin-inline-start:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;
  padding:1px 6px;border-radius:9px;background:var(--crit);color:#fff}
.rail-foot{margin-top:auto;padding:16px 18px 0;border-top:1px solid rgba(255,255,255,.08);
  font-size:11px;color:rgba(255,255,255,.4);line-height:1.5}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:10px;padding:12px 22px;background:var(--card);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.top h1{font-size:17px;margin-inline-end:auto}
.tbtn{background:transparent;border:1px solid var(--line-2);color:var(--body);
  padding:6px 12px;border-radius:var(--r);cursor:pointer;font-size:12.5px;transition:.12s}
.tbtn:hover{background:var(--page);border-color:var(--muted)}
.tbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.tbtn.primary:hover{filter:brightness(1.08)}

main{padding:22px;max-width:1180px}

/* ---------- cards / metrics ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:8px}
.card-h{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.card-h h2{font-size:14px}
.card-b{padding:16px}

.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.metric{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.metric .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  font-weight:500;margin-bottom:6px}
.metric .v{font-family:"IBM Plex Mono",monospace;font-size:26px;font-weight:600;color:var(--ink);
  line-height:1.1;font-variant-numeric:tabular-nums;direction:ltr}
.metric .s{font-size:12px;color:var(--muted);margin-top:4px}
.metric.crit .v{color:var(--crit)} .metric.warn .v{color:var(--warn)} .metric.ok .v{color:var(--ok)}

.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;background:var(--ok)}

/* ---------- severity ---------- */
.sev{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
  letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:4px;white-space:nowrap}
.sev.critical{background:var(--crit-bg);color:var(--crit);border:1px solid var(--crit-line)}
.sev.warning{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line)}
.sev.info{background:var(--info-bg);color:var(--info)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}

/* ---------- upload ---------- */
.drop{border:2px dashed var(--line-2);border-radius:10px;padding:44px 24px;text-align:center;
  background:var(--card);transition:.15s;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop h3{font-size:16px;margin-bottom:6px}
.drop p{color:var(--muted);font-size:13px;max-width:44ch;margin:0 auto}
.drop .ic{font-family:"IBM Plex Mono",monospace;font-size:22px;color:var(--accent);margin-bottom:10px}

/* ---------- findings (audit workpaper style) ---------- */
.finding{background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:10px;
  border-inline-start:3px solid var(--line-2);overflow:hidden}
.finding.critical{border-inline-start-color:var(--crit)}
.finding.warning{border-inline-start-color:var(--warn)}
.finding.done{opacity:.55}
.f-h{padding:13px 16px;display:flex;align-items:flex-start;gap:11px;flex-wrap:wrap}
.f-t{flex:1;min-width:220px}
.f-t h3{font-size:14.5px;margin-bottom:3px}
.f-t p{font-size:13px;color:var(--body);line-height:1.55}
.f-nums{display:flex;gap:20px;flex-wrap:wrap;padding:11px 16px;background:var(--page);
  border-block:1px solid var(--line)}
.f-num .k{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:500}
.f-num .v{font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:600;color:var(--ink);
  font-variant-numeric:tabular-nums;direction:ltr}
.f-num .v.neg{color:var(--crit)}
.f-calc{padding:9px 16px;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted);
  background:var(--page);border-bottom:1px solid var(--line);direction:ltr;text-align:start;word-break:break-word}
.f-f{padding:11px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* the cross-reference chip — the audit tie-out */
.xref{display:inline-flex;align-items:center;gap:5px;font-family:"IBM Plex Mono",monospace;
  font-size:11.5px;padding:3px 8px;border-radius:4px;border:1px solid var(--line-2);
  background:var(--card);color:var(--accent);cursor:pointer;transition:.12s;direction:ltr}
.xref:hover{background:var(--accent-soft);border-color:var(--accent)}
.act{margin-inline-start:auto;display:flex;gap:6px}
.act button{border:1px solid var(--line-2);background:var(--card);color:var(--body);
  padding:5px 11px;border-radius:var(--r);cursor:pointer;font-size:12.5px}
.act button:hover{background:var(--page)}
.act button.ok{border-color:var(--ok);color:var(--ok)}
.status-tag{font-size:11.5px;font-weight:500;padding:3px 9px;border-radius:4px}
.status-tag.reviewed{background:var(--info-bg);color:var(--info)}
.status-tag.approved{background:var(--ok-bg);color:var(--ok)}
.status-tag.investigating{background:var(--warn-bg);color:var(--warn)}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:start;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--page);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}
td.n{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;text-align:end;direction:ltr}

/* ---------- report ---------- */
.report h2{font-size:16px;margin:22px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.report h2:first-child{margin-top:0}
.report p{margin-bottom:9px;line-height:1.68;color:var(--body)}
.report .src{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);direction:ltr}
.unknown{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn);
  padding:9px 12px;border-radius:var(--r);font-size:13px;margin-bottom:9px}

/* ---------- inspector ---------- */
.scrim{position:fixed;inset:0;background:rgba(15,23,41,.55);z-index:40;display:none}
.scrim.on{display:block}
.insp{position:fixed;inset-block:0;inset-inline-end:0;width:min(500px,100%);background:var(--card);
  z-index:41;overflow-y:auto;display:none;box-shadow:-10px 0 34px rgba(0,0,0,.22)}
.insp.on{display:block}
.insp-h{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;
  position:sticky;top:0;background:var(--card)}
.insp-h h2{font-size:15px;flex:1}
.x{background:none;border:none;font-size:21px;cursor:pointer;color:var(--muted);line-height:1}
.cellgrid{border:1px solid var(--line);border-radius:var(--r);overflow:auto}
.cellgrid table{font-size:12px}
.cellgrid td{padding:6px 9px;border:1px solid var(--line);white-space:nowrap}
.cellgrid td.hit{background:var(--accent-soft);outline:2px solid var(--accent);font-weight:600;color:var(--ink)}
.cellgrid td.rowhdr,.cellgrid th{background:var(--page);color:var(--muted);
  font-family:"IBM Plex Mono",monospace;font-size:11px}

.empty{padding:52px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;font-size:16px;color:var(--ink);margin-bottom:5px}
.hide{display:none!important}
.note{font-size:12.5px;color:var(--muted);line-height:1.6}
.chartwrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="app">
  <aside class="rail">
    <div class="brand">
      <span class="brand-mark">FS</span>
      <span><span class="brand-name">FinSight</span><br>
      <span class="brand-sub" data-t="railSub">Financial input review</span></span>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot">
      <span data-t="privacy">Workbooks are read in your browser. No file is uploaded.</span>
    </div>
  </aside>

  <div>
    <div class="top">
      <h1 id="pageTitle">Dashboard</h1>
      <button class="tbtn" id="themeBtn">Dark</button>
      <button class="tbtn" id="langBtn">العربية</button>
      <button class="tbtn primary" id="demoBtn" data-t="loadDemo">Load demo workbook</button>
    </div>
    <main id="view"></main>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="insp" id="insp" role="dialog" aria-modal="true"></aside>

function norm(s) {
  return String(s == null ? "" : s)
    .replace(/[\u064B-\u0652\u0640]/g, "")      // strip harakat + tatweel
    .replace(/[\u0623\u0625\u0622\u0671]/g, "\u0627") // alef variants -> alef
    .replace(/\u0649/g, "\u064A")                // alef maqsura -> ya
    .replace(/\u0629/g, "\u0647")                // ta marbuta -> ha
    .toLowerCase()
    .replace(/[^\p{L}\p{N}]+/gu, " ")
    .trim();
}

/* --------------------------------------------------------------------------
   2. FINANCIAL CATEGORY DICTIONARY
   -------------------------------------------------------------------------- */
var CATEGORIES = {
  revenue:            ["revenue","sales","net sales","turnover","المبيعات","الايرادات","صافي المبيعات"],
  cogs:               ["cost of goods sold","cogs","cost of sales","تكلفه المبيعات","تكلفه البضاعه المباعه"],
  gross_profit:       ["gross profit","مجمل الربح","اجمالي الربح","الربح الاجمالي"],
  payroll:            ["payroll","salaries","wages","salaries and wages","الرواتب","الاجور","المرتبات"],
  utilities:          ["utilities","electricity","الكهرباء","المرافق","الكهرباء والمياه"],
  maintenance:        ["maintenance","repairs","الصيانه"],
  freight:            ["freight","logistics","shipping","freight logistics","الشحن","النقل"],
  other_opex:         ["other operating expenses","other expenses","مصروفات اخري"],
  total_opex:         ["total operating expenses","operating expenses","opex","المصروفات التشغيليه","اجمالي المصروفات التشغيليه"],
  ebitda:             ["ebitda","الارباح قبل الفوائد والضرائب والاهلاك والاستهلاك"],
  ebit:               ["ebit","operating profit","الربح التشغيلي"],
  depreciation:       ["depreciation","depreciation amortisation","depreciation and amortization","الاهلاك","الاستهلاك"],
  interest:           ["interest","interest expense","الفوائد","مصروف الفوائد"],
  tax:                ["income tax","tax","taxes","الضرائب","ضريبه الدخل"],
  net_income:         ["net income","net profit","profit for the period","صافي الربح","صافي الدخل"],
  pbt:                ["profit before tax","pbt","الربح قبل الضرائب"],
  cash:               ["cash","cash and equivalents","النقديه","النقديه وما في حكمها"],
  ar:                 ["accounts receivable","receivables","trade receivables","العملاء","المدينون"],
  inventory:          ["inventory","stock","المخزون"],
  ppe:                ["ppe","property plant and equipment","fixed assets","الاصول الثابته"],
  total_assets:       ["total assets","اجمالي الاصول"],
  ap:                 ["accounts payable","payables","trade payables","الموردون","الدائنون"],
  debt:               ["debt","loans","borrowings","القروض"],
  total_liabilities:  ["total liabilities","اجمالي الخصوم"],
  equity:             ["equity","shareholders equity","حقوق الملكيه","حقوق المساهمين"],
  total_liab_equity:  ["total liabilities and equity","اجمالي الخصوم وحقوق الملكيه"],
  capex:              ["capex","capital expenditure","الاستثمارات الراسماليه"]
};

var CAT_LOOKUP = (function () {
  var m = {};
  Object.keys(CATEGORIES).forEach(function (k) {
    CATEGORIES[k].forEach(function (syn) { m[norm(syn)] = k; });
  });
  return m;
})();

function classify(label) {
  var n = norm(label);
  if (!n) return null;
  if (CAT_LOOKUP[n]) return CAT_LOOKUP[n];
  // longest-synonym containment, so "total operating expenses" beats "expenses"
  var best = null, bestLen = 0;
  Object.keys(CAT_LOOKUP).forEach(function (syn) {
    if (syn.length > bestLen && (n === syn || n.indexOf(syn) > -1)) {
      best = CAT_LOOKUP[syn]; bestLen = syn.length;
    }
  });
  return best;
}

var TOTAL_WORDS = ["total","اجمالي","مجموع","اجمالى"];
function looksLikeTotal(label) {
  var n = norm(label);
  return TOTAL_WORDS.some(function (w) { return n.indexOf(w) === 0 || n.indexOf(" " + w) > -1; });
}

/* --------------------------------------------------------------------------
   3. PERIOD DETECTION
   -------------------------------------------------------------------------- */
var MONTHS = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
var MONTHS_AR = ["ينا","فبر","مار","ابر","ماي","يون","يول","اغس","سبت","اكت","نوف","ديس"];

function parsePeriod(v) {
  if (v == null || v === "") return null;
  if (v instanceof Date) return { label: v.toISOString().slice(0, 7), sort: v.getTime(), kind: "month" };
  var s = String(v).trim(), n = norm(s);
  var mi = MONTHS.findIndex(function (m) { return n.indexOf(m) === 0; });
  if (mi === -1) mi = MONTHS_AR.findIndex(function (m) { return n.indexOf(norm(m)) === 0; });
  if (mi > -1) {
    var yr = (s.match(/(\d{2,4})/) || [])[1];
    var y = yr ? (yr.length === 2 ? 2000 + +yr : +yr) : 2000;
    return { label: s, sort: y * 100 + mi + 1, kind: "month" };
  }
  var q = n.match(/^q([1-4])\D*(\d{2,4})?/);
  if (q) {
    var qy = q[2] ? (q[2].length === 2 ? 2000 + +q[2] : +q[2]) : 2000;
    return { label: s, sort: qy * 100 + +q[1] * 3, kind: "quarter" };
  }
  if (/^(19|20)\d{2}$/.test(s.trim())) return { label: s, sort: +s * 100, kind: "year" };
  return null;
}

/* --------------------------------------------------------------------------
   4. CURRENCY DETECTION
   -------------------------------------------------------------------------- */
var CURRENCIES = [
  { code: "EGP", pat: /\begp\b|جنيه|ج\.?م/i },
  { code: "USD", pat: /\busd\b|\$|دولار/i },
  { code: "EUR", pat: /\beur\b|€|يورو/i },
  { code: "GBP", pat: /\bgbp\b|£|استرليني/i },
  { code: "SAR", pat: /\bsar\b|ريال/i },
  { code: "AED", pat: /\baed\b|درهم/i }
];
function detectCurrency(texts) {
  for (var i = 0; i < CURRENCIES.length; i++)
    if (texts.some(function (t) { return CURRENCIES[i].pat.test(t); })) return CURRENCIES[i].code;
  return null;
}

/* --------------------------------------------------------------------------
   5. INGESTION
   Input: array of { name, rows: [[cell,...]] } where cell = {v, f, a}
          v = value, f = formula string (or null), a = "A1" address
   -------------------------------------------------------------------------- */
function isNum(v) { return typeof v === "number" && isFinite(v); }

function ingestSheet(sheet) {
  var rows = sheet.rows, texts = [];
  rows.forEach(function (r) {
    r.forEach(function (c) { if (c && typeof c.v === "string") texts.push(c.v); });
  });

  // header row = the row yielding the most parsable periods
  var headerRow = -1, periods = [], bestCount = 0;
  for (var i = 0; i < Math.min(rows.length, 25); i++) {
    var found = [];
    (rows[i] || []).forEach(function (c, j) {
      if (!c) return;
      var p = parsePeriod(c.v);
      if (p) { p.col = j; found.push(p); }
    });
    if (found.length > bestCount) { bestCount = found.length; headerRow = i; periods = found; }
  }
  if (bestCount < 2) return { name: sheet.name, periods: [], lineItems: [], skipped: true };

  periods.sort(function (a, b) { return a.sort - b.sort; });

  // label column = left-most column with the most non-numeric strings below the header
  var labelCol = 0, bestLabels = 0;
  for (var c0 = 0; c0 < Math.min(4, periods[0].col); c0++) {
    var cnt = 0;
    for (var r0 = headerRow + 1; r0 < rows.length; r0++) {
      var cell = (rows[r0] || [])[c0];
      if (cell && typeof cell.v === "string" && cell.v.trim()) cnt++;
    }
    if (cnt > bestLabels) { bestLabels = cnt; labelCol = c0; }
  }

  var lineItems = [];
  for (var r = headerRow + 1; r < rows.length; r++) {
    var row = rows[r] || [];
    var lc = row[labelCol];
    var label = lc && typeof lc.v === "string" ? lc.v.trim() : "";
    if (!label) continue;

    var values = [], cells = [], formulas = [], numCount = 0;
    periods.forEach(function (p) {
      var cell = row[p.col];
      var v = cell && isNum(cell.v) ? cell.v : null;
      if (v !== null) numCount++;
      values.push(v);
      cells.push(cell ? cell.a : null);
      formulas.push(cell && cell.f ? cell.f : null);
    });
    if (numCount === 0) continue;

    lineItems.push({
      label: label, row: r, sheet: sheet.name,
      category: classify(label), isTotal: looksLikeTotal(label),
      values: values, cells: cells, formulas: formulas
    });
  }

  return {
    name: sheet.name, headerRow: headerRow, labelCol: labelCol,
    periods: periods, lineItems: lineItems,
    currency: detectCurrency(texts), skipped: false
  };
}

function ingest(workbook) {
  var sheets = workbook.sheets.map(ingestSheet);
  var cur = null;
  sheets.forEach(function (s) { if (!cur && s.currency) cur = s.currency; });
  return {
    sheets: sheets,
    currency: cur || "EGP",
    stats: {
      sheetCount: workbook.sheets.length,
      analysed: sheets.filter(function (s) { return !s.skipped; }).length,
      lineItems: sheets.reduce(function (a, s) { return a + s.lineItems.length; }, 0),
      periods: sheets.reduce(function (a, s) { return Math.max(a, s.periods.length); }, 0)
    }
  };
}

/* --------------------------------------------------------------------------
   6. DETERMINISTIC ARITHMETIC
   Money is rounded to 2dp before comparison so float noise never fires a check.
   -------------------------------------------------------------------------- */
function r2(x) { return Math.round((x + Number.EPSILON) * 100) / 100; }
function sum(a) { return a.reduce(function (x, y) { return x + (isNum(y) ? y : 0); }, 0); }
function pct(cur, prev) { return isNum(cur) && isNum(prev) && prev !== 0 ? (cur - prev) / Math.abs(prev) : null; }
function median(a) {
  var s = a.filter(isNum).slice().sort(function (x, y) { return x - y; });
  if (!s.length) return null;
  var m = Math.floor(s.length / 2);
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}
function mad(a) {
  var m = median(a); if (m === null) return null;
  return median(a.filter(isNum).map(function (x) { return Math.abs(x - m); }));
}

/* --------------------------------------------------------------------------
   7. FINDINGS
   -------------------------------------------------------------------------- */
var SEV = { CRITICAL: "critical", WARNING: "warning", INFO: "info" };

function finding(o) {
  return {
    id: o.id, severity: o.severity, type: o.type,
    metric: o.metric || "", period: o.period || "",
    sheet: o.sheet, cells: o.cells || [],
    current: o.current == null ? null : o.current,
    comparison: o.comparison == null ? null : o.comparison,
    variance: o.variance == null ? null : o.variance,
    en: o.en, ar: o.ar,
    calc: o.calc || null,
    suggestion: o.suggestion || null,
    status: "open"
  };
}

var DEFAULTS = {
  revenueVariancePct: 0.10,
  expenseVariancePct: 0.15,
  balanceToleranceAbs: 1,
  anomalyZ: 3.5,
  marginDropPts: 3
};

/* --------------------------------------------------------------------------
   8. VALIDATION
   -------------------------------------------------------------------------- */
function validate(model, cfg) {
  cfg = Object.assign({}, DEFAULTS, cfg || {});
  var out = [], seq = 0;
  var id = function (p) { return p + "-" + (++seq); };

  var byCat = {};
  model.sheets.forEach(function (sh) {
    sh.lineItems.forEach(function (li) {
      if (li.category) (byCat[li.category] = byCat[li.category] || []).push({ sh: sh, li: li });
    });
  });
  var pick = function (cat) { return (byCat[cat] || [])[0]; };

  /* ---- 8a. accounting identities ---------------------------------------- */
  function identity(lhsCat, rhsCats, labelEn, labelAr, sev) {
    var L = pick(lhsCat); if (!L) return;
    var Rs = rhsCats.map(pick); if (Rs.some(function (x) { return !x; })) return;
    if (Rs.some(function (x) { return x.sh.name !== L.sh.name; })) return;

    L.sh.periods.forEach(function (p, i) {
      var lv = L.li.values[i];
      if (!isNum(lv)) return;
      var rv = 0, ok = true;
      Rs.forEach(function (R, k) {
        var v = R.li.values[i];
        if (!isNum(v)) { ok = false; return; }
        rv += (k === 0 ? v : (lhsCat === "gross_profit" ? -v : v));
      });
      if (!ok) return;
      var diff = r2(lv - rv);
      if (Math.abs(diff) <= cfg.balanceToleranceAbs) return;
      out.push(finding({
        id: id("IDENT"), severity: sev, type: "identity",
        metric: labelEn, period: p.label, sheet: L.sh.name,
        cells: [L.li.cells[i]].concat(Rs.map(function (R) { return R.li.cells[i]; })).filter(Boolean),
        current: lv, comparison: rv, variance: diff,
        calc: labelEn + " — stated " + lv.toLocaleString() + " vs computed " + rv.toLocaleString(),
        en: labelEn + " does not reconcile at " + p.label + ". Difference of " + Math.abs(diff).toLocaleString() + ".",
        ar: labelAr + " لا يتطابق في " + p.label + ". الفرق " + Math.abs(diff).toLocaleString() + "."
      }));
    });
  }

  identity("total_assets", ["total_liab_equity"], "Balance sheet", "الميزانية", SEV.CRITICAL);
  identity("gross_profit", ["revenue", "cogs"], "Gross profit", "مجمل الربح", SEV.CRITICAL);

  /* ---- 8b. totals vs the components above them --------------------------
     Components are the CONTIGUOUS rows directly above the total. A blank row,
     a preceding subtotal, or any gap ends the block — otherwise a walk-back
     happily sums Revenue and COGS into "Total Operating Expenses".          */
  model.sheets.forEach(function (sh) {
    sh.lineItems.forEach(function (li, idx) {
      if (!li.isTotal) return;
      var comps = [], expectedRow = li.row - 1;
      for (var k = idx - 1; k >= 0; k--) {
        var prev = sh.lineItems[k];
        if (prev.row !== expectedRow) break;   // gap -> end of block
        if (prev.isTotal) break;               // another total -> end of block
        comps.unshift(prev);
        expectedRow--;
      }
      if (comps.length < 2) return;

      sh.periods.forEach(function (p, i) {
        var stated = li.values[i];
        if (!isNum(stated)) return;
        var parts = comps.map(function (c) { return c.values[i]; });
        if (parts.filter(isNum).length < 2) return;
        var computed = r2(sum(parts)), diff = r2(stated - computed);
        if (Math.abs(diff) <= cfg.balanceToleranceAbs) return;
        out.push(finding({
          id: id("TOTAL"), severity: SEV.CRITICAL, type: "total_mismatch",
          metric: li.label, period: p.label, sheet: sh.name,
          cells: [li.cells[i]].concat(comps.map(function (c) { return c.cells[i]; })).filter(Boolean),
          current: stated, comparison: computed, variance: diff,
          calc: li.label + " = " + comps.map(function (c) { return c.label; }).join(" + "),
          en: '"' + li.label + '" at ' + p.label + " shows " + stated.toLocaleString() +
              " but its components sum to " + computed.toLocaleString() + ".",
          ar: '"' + li.label + '" في ' + p.label + " مسجل " + stated.toLocaleString() +
              " بينما مجموع بنوده " + computed.toLocaleString() + "."
        }));
      });
    });
  });

  /* ---- 8c. a literal sitting in a row that is otherwise formulas -------- */
  model.sheets.forEach(function (sh) {
    sh.lineItems.forEach(function (li) {
      var withF = li.formulas.filter(Boolean).length;
      var withV = li.values.filter(isNum).length;
      if (withF < 2 || withF >= withV) return;
      li.values.forEach(function (v, i) {
        if (!isNum(v) || li.formulas[i]) return;
        out.push(finding({
          id: id("HARD"), severity: SEV.WARNING, type: "hardcoded",
          metric: li.label, period: sh.periods[i].label, sheet: sh.name,
          cells: [li.cells[i]], current: v,
          calc: "Sibling periods use: " + (li.formulas.filter(Boolean)[0] || ""),
          en: '"' + li.label + '" at ' + sh.periods[i].label +
              " is a typed number while every other period is a formula. Typed-over formulas are a common source of silent error.",
          ar: '"' + li.label + '" في ' + sh.periods[i].label +
              " قيمة مكتوبة يدويًا بينما باقي الفترات معادلات. الكتابة فوق المعادلات سبب شائع للأخطاء غير الظاهرة."
        }));
      });
    });
  });

  /* ---- 8d. gaps inside an otherwise populated series -------------------- */
  model.sheets.forEach(function (sh) {
    sh.lineItems.forEach(function (li) {
      var idxs = li.values.map(function (v, i) { return isNum(v) ? i : -1; }).filter(function (i) { return i > -1; });
      if (idxs.length < 3) return;
      for (var i = idxs[0]; i < idxs[idxs.length - 1]; i++) {
        if (isNum(li.values[i])) continue;
        out.push(finding({
          id: id("MISS"), severity: SEV.WARNING, type: "missing",
          metric: li.label, period: sh.periods[i].label, sheet: sh.name,
          cells: [li.cells[i]],
          en: '"' + li.label + '" has no value at ' + sh.periods[i].label +
              " although the periods either side are populated.",
          ar: '"' + li.label + '" بدون قيمة في ' + sh.periods[i].label + " رغم وجود قيم قبله وبعده."
        }));
      }
    });
  });

  /* ---- 8e. duplicated line items ---------------------------------------- */
  model.sheets.forEach(function (sh) {
    var seen = {};
    sh.lineItems.forEach(function (li) {
      var key = norm(li.label) + "|" + li.values.join(",");
      if (seen[key]) {
        out.push(finding({
          id: id("DUP"), severity: SEV.CRITICAL, type: "duplicate",
          metric: li.label, sheet: sh.name,
          cells: [seen[key].cells[0], li.cells[0]].filter(Boolean),
          current: sum(li.values),
          en: '"' + li.label + '" appears twice with identical values (rows ' +
              (seen[key].row + 1) + " and " + (li.row + 1) + "). If unintended this double-counts " +
              sum(li.values).toLocaleString() + ".",
          ar: '"' + li.label + '" مكرر بنفس القيم (صف ' + (seen[key].row + 1) + " و " + (li.row + 1) +
              "). إذا كان غير مقصود فهذا يضاعف " + sum(li.values).toLocaleString() + "."
        }));
      } else seen[key] = li;
    });
  });

  /* ---- 8f. period-over-period movement ---------------------------------- */
  var EXPENSEY = ["cogs","payroll","utilities","maintenance","freight","other_opex","total_opex"];
  model.sheets.forEach(function (sh) {
    sh.lineItems.forEach(function (li) {
      if (!li.category || li.isTotal && li.category !== "total_opex") return;
      var thr = li.category === "revenue" ? cfg.revenueVariancePct
              : EXPENSEY.indexOf(li.category) > -1 ? cfg.expenseVariancePct : null;
      if (thr === null) return;

      for (var i = 1; i < li.values.length; i++) {
        var d = pct(li.values[i], li.values[i - 1]);
        if (d === null || Math.abs(d) < thr) continue;
        out.push(finding({
          id: id("VAR"), severity: SEV.WARNING, type: "variance",
          metric: li.label, period: sh.periods[i].label, sheet: sh.name,
          cells: [li.cells[i], li.cells[i - 1]].filter(Boolean),
          current: li.values[i], comparison: li.values[i - 1], variance: d,
          calc: "(" + li.values[i].toLocaleString() + " - " + li.values[i - 1].toLocaleString() +
                ") / " + Math.abs(li.values[i - 1]).toLocaleString() + " = " + (d * 100).toFixed(1) + "%",
          en: li.label + " moved " + (d * 100).toFixed(1) + "% from " + sh.periods[i - 1].label +
              " to " + sh.periods[i].label + ", beyond the " + (thr * 100) + "% threshold.",
          ar: li.label + " تغير بنسبة " + (d * 100).toFixed(1) + "% من " + sh.periods[i - 1].label +
              " إلى " + sh.periods[i].label + "، وهو يتجاوز حد " + (thr * 100) + "%."
        }));
      }
    });
  });

  /* ---- 8g. actual vs budget --------------------------------------------- */
  var budgetSheet = model.sheets.filter(function (s) {
    return !s.skipped && /budget|forecast|موازنه|الموازنه|توقعات/.test(norm(s.name));
  })[0];
  var actualSheet = model.sheets.filter(function (s) {
    return !s.skipped && s !== budgetSheet && s.lineItems.length > 3;
  })[0];

  if (budgetSheet && actualSheet) {
    actualSheet.lineItems.forEach(function (a) {
      var b = budgetSheet.lineItems.filter(function (x) { return norm(x.label) === norm(a.label); })[0];
      if (!b) return;
      var thr = a.category === "revenue" ? cfg.revenueVariancePct : cfg.expenseVariancePct;
      actualSheet.periods.forEach(function (p, i) {
        var bi = budgetSheet.periods.findIndex(function (q) { return q.sort === p.sort; });
        if (bi === -1) return;
        var d = pct(a.values[i], b.values[bi]);
        if (d === null || Math.abs(d) < thr) return;
        out.push(finding({
          id: id("BUD"), severity: SEV.WARNING, type: "budget",
          metric: a.label, period: p.label, sheet: actualSheet.name,
          cells: [a.cells[i], b.cells[bi]].filter(Boolean),
          current: a.values[i], comparison: b.values[bi], variance: d,
          calc: "actual " + a.values[i].toLocaleString() + " vs budget " + b.values[bi].toLocaleString(),
          en: a.label + " at " + p.label + " is " + (d * 100).toFixed(1) + "% against budget.",
          ar: a.label + " في " + p.label + " بنسبة " + (d * 100).toFixed(1) + "% مقابل الموازنة."
        }));
      });
    });
  }

  /* ---- 8h. statistical anomaly (median + MAD, robust to outliers) ------- */
  model.sheets.forEach(function (sh) {
    sh.lineItems.forEach(function (li) {
      var vals = li.values.filter(isNum);
      if (vals.length < 5) return;
      var m = median(li.values), d = mad(li.values);
      if (m === null || !d) return;
      li.values.forEach(function (v, i) {
        if (!isNum(v)) return;
        var z = 0.6745 * (v - m) / d;
        if (Math.abs(z) < cfg.anomalyZ) return;
        out.push(finding({
          id: id("ANOM"), severity: SEV.WARNING, type: "anomaly",
          metric: li.label, period: sh.periods[i].label, sheet: sh.name,
          cells: [li.cells[i]], current: v, comparison: m, variance: pct(v, m),
          calc: "median " + m.toLocaleString() + ", robust z = " + z.toFixed(1),
          en: "Unusual movement detected in " + li.label + " at " + sh.periods[i].label +
              " — review recommended. It sits far from its own history (median " + m.toLocaleString() + ").",
          ar: "حركة غير معتادة في " + li.label + " في " + sh.periods[i].label +
              " — يُنصح بالمراجعة. القيمة بعيدة عن سلوكها التاريخي (الوسيط " + m.toLocaleString() + ")."
        }));
      });
    });
  });

  /* ---- 8i. gross margin shift ------------------------------------------- */
  var rev = pick("revenue"), cogs = pick("cogs");
  if (rev && cogs && rev.sh === cogs.sh) {
    var sh = rev.sh, margins = sh.periods.map(function (p, i) {
      var r = rev.li.values[i], c = cogs.li.values[i];
      return isNum(r) && isNum(c) && r !== 0 ? (r - c) / r : null;
    });
    for (var i = 1; i < margins.length; i++) {
      if (margins[i] === null || margins[i - 1] === null) continue;
      var dp = (margins[i] - margins[i - 1]) * 100;
      if (Math.abs(dp) < cfg.marginDropPts) continue;
      out.push(finding({
        id: id("MARGIN"), severity: SEV.WARNING, type: "margin",
        metric: "Gross margin", period: sh.periods[i].label, sheet: sh.name,
        cells: [rev.li.cells[i], cogs.li.cells[i]].filter(Boolean),
        current: margins[i], comparison: margins[i - 1], variance: dp / 100,
        calc: "Gross margin = (Revenue - COGS) / Revenue — " +
              (margins[i - 1] * 100).toFixed(1) + "% -> " + (margins[i] * 100).toFixed(1) + "%",
        en: "Gross margin moved " + dp.toFixed(1) + " points from " + sh.periods[i - 1].label +
            " to " + sh.periods[i].label + ".",
        ar: "هامش الربح الإجمالي تغير بمقدار " + dp.toFixed(1) + " نقطة من " +
            sh.periods[i - 1].label + " إلى " + sh.periods[i].label + "."
      }));
    }
  }

  /* ---- score -------------------------------------------------------------
     Deliberately simple and explainable: the share of validated data points
     that came back clean, weighting a critical finding as 3 warnings.
     A number a finance manager can be told the meaning of in one sentence.  */
  var crit = out.filter(function (f) { return f.severity === SEV.CRITICAL; }).length;
  var warn = out.filter(function (f) { return f.severity === SEV.WARNING; }).length;
  var checked = Math.max(1, model.stats.lineItems * Math.max(1, model.stats.periods));
  var weighted = crit * 3 + warn;
  var score = Math.max(0, Math.min(100, Math.round(100 * (1 - weighted / checked))));

  return {
    findings: out,
    summary: {
      critical: crit, warning: warn, total: out.length,
      score: score, checked: checked, weighted: weighted
    }
  };
}

return {
  ingest: ingest, validate: validate, classify: classify, norm: norm,
  parsePeriod: parsePeriod, detectCurrency: detectCurrency,
  DEFAULTS: DEFAULTS, CATEGORIES: CATEGORIES, SEVERITY: SEV
};
});

</script>

/* localStorage throws outright on a file:// origin and under strict privacy
   settings in Safari. Unwrapped, that one call kills the entire script and
   the page renders blank with no visible cause. Preferences are a nicety;
   losing them must never cost the app. */
var store = {
  get: function(k){ try { return window.localStorage.getItem(k); } catch(e){ return null; } },
  set: function(k,v){ try { window.localStorage.setItem(k,v); } catch(e){ /* ignore */ } }
};

var lang = store.get("fs_lang") === "ar" ? "ar" : "en";
var theme = store.get("fs_theme") === "dark" ? "dark" : "light";
function t(k){ return (T[lang] && T[lang][k]) || T.en[k] || k; }
function loc(){ return lang === "ar" ? "ar-EG-u-nu-latn" : "en-GB"; }

var el = function(id){ return document.getElementById(id); };

/* Fail in words, not in the console. A blocked CDN or a missing engine file
   otherwise shows up only as "XLSX is not defined" on a blank screen. */
function halt(title, body){

    '<h2 style="color:var(--crit);margin-bottom:6px">'+title+'</h2>'+
    '<p class="note">'+body+'</p></div></div>';
  el("demoBtn").disabled = true;
  el("demoBtn").style.opacity = ".5";
}
var MISSING = null;
if(typeof XLSX === "undefined")
  MISSING = ["Spreadsheet library did not load",
    "This page needs cdn.jsdelivr.net to read Excel files. Check the connection or any network filtering, then reload."];
else if(typeof FinSight === "undefined")
  MISSING = ["Validation engine did not load",
    "finsight-engine.js must sit in the same folder as this page. Without it there is nothing to validate with."];

window.addEventListener("error", function(e){
  console.error("FinSight uncaught:", e.message, e.filename + ":" + e.lineno);
});
window.addEventListener("unhandledrejection", function(e){
  console.error("FinSight unhandled rejection:", e.reason);
});

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function fmt(n, dp){ if(n===null||n===undefined||!isFinite(n)) return t("nothing");
  return new Intl.NumberFormat(loc(),{minimumFractionDigits:dp||0,maximumFractionDigits:dp||0}).format(n); }
function pctf(n){ return n===null||n===undefined||!isFinite(n) ? t("nothing") : (n*100).toFixed(1)+"%"; }

/* ===================== workbook -> engine input ===================== */
function toEngine(wb){
  return { sheets: wb.SheetNames.map(function(name){
    var ws = wb.Sheets[name], ref = ws["!ref"];
    if(!ref) return { name:name, rows:[] };
    var R = XLSX.utils.decode_range(ref), rows = [];
    for(var r=R.s.r;r<=R.e.r;r++){
      var row=[];
      for(var c=R.s.c;c<=R.e.c;c++){
        var a = XLSX.utils.encode_cell({r:r,c:c}), cell = ws[a];
        row.push(cell ? {v:cell.v, f:cell.f||null, a:a} : null);
      }
      rows.push(row);
    }
    return { name:name, rows:rows };
  })};
}

function analyse(wb, fileName){
  S.wb = wb; S.file = { name:fileName, at:new Date() };
  S.model = FinSight.ingest(toEngine(wb));
  S.result = FinSight.validate(S.model, S.cfg);
  render();
}

  {id:"settings",key:"nav_settings"}
];

  el("nav").innerHTML = PAGES.map(function(p){

    return '<button data-page="'+p.id+'" class="'+(S.page===p.id?"on":"")+'">'+esc(t(p.key))+b+'</button>';
  }).join("");
  Array.prototype.forEach.call(el("nav").querySelectorAll("button"), function(b){
    b.addEventListener("click", function(){ S.page = b.getAttribute("data-page"); render(); });
  });
}

/* ===================== pages ===================== */
function metric(k, v, sub, cls, extra){
  return '<div class="metric '+(cls||"")+'"><div class="k">'+esc(k)+'</div>'+
         '<div class="v">'+v+'</div>'+(sub?'<div class="s">'+esc(sub)+'</div>':"")+(extra||"")+'</div>';
}

function pageDash(){
  if(!S.result) return emptyState();

  var open = F.filter(function(f){return f.status==="open";}).length;
  var anom = F.filter(function(f){return f.type==="anomaly";}).length;
  return '<div class="metrics">'+
    metric(t("score"), s.score+"%", t("scoreNote"), s.score>=90?"ok":s.score>=70?"warn":"crit",
           '<div class="bar"><i style="width:'+s.score+'%;background:'+
           (s.score>=90?"var(--ok)":s.score>=70?"var(--warn)":"var(--crit)")+'"></i></div>')+
    metric(t("critical"), fmt(s.critical), "", s.critical?"crit":"ok")+
    metric(t("warnings"), fmt(s.warning), "", s.warning?"warn":"ok")+
    metric(t("pending"), fmt(open))+
    metric(t("anomalies"), fmt(anom))+
    metric(t("checked"), fmt(s.checked))+
  '</div>'+ charts() +
  '<div class="card" style="margin-top:18px"><div class="card-h"><h2>'+esc(t("issuesH"))+'</h2></div>'+
  '<div class="card-b">'+
    (F.filter(function(f){return f.severity==="critical";}).slice(0,4)
      .map(function(f){ return findingCard(f, true); }).join("") ||
     '<p class="note">'+esc(t("allClearB"))+'</p>')+
  '</div></div>';
}

function charts(){
  var sh = S.model.sheets.filter(function(x){return !x.skipped;})[0];
  if(!sh) return "";
  var rev = sh.lineItems.filter(function(l){return l.category==="revenue";})[0];
  var cogs = sh.lineItems.filter(function(l){return l.category==="cogs";})[0];
  if(!rev) return "";
  var out = '<div class="chartwrap">';
  out += chartCard(t("revenueH"), sh.periods.map(function(p){return p.label;}), rev.values, false);
  if(cogs){
    var m = rev.values.map(function(v,i){
      var c = cogs.values[i];
      return (typeof v==="number" && typeof c==="number" && v) ? (v-c)/v*100 : null; });
    out += chartCard(lang==="ar"?"هامش الربح الإجمالي %":"Gross margin %", sh.periods.map(function(p){return p.label;}), m, true);
  }
  return out + '</div>';
}

function chartCard(title, labels, vals, isPct){
  var pts = vals.map(function(v,i){return {v:v,i:i};}).filter(function(p){return typeof p.v==="number";});
  if(pts.length < 2) return "";
  var W=560,H=150,P=26;
  var mx = Math.max.apply(null, pts.map(function(p){return p.v;}));
  var mn = Math.min.apply(null, pts.map(function(p){return p.v;}));
  if(mx===mn){mx=mx*1.1||1;mn=0;}
  var pad=(mx-mn)*0.12; mx+=pad; mn=isPct?Math.max(0,mn-pad):Math.min(mn-pad, mn>0?0:mn-pad);
  var x=function(i){return P + i*(W-P*2)/(labels.length-1);};
  var y=function(v){return H-P - (v-mn)/(mx-mn)*(H-P*2);};
  var d = pts.map(function(p,k){return (k?"L":"M")+x(p.i).toFixed(1)+" "+y(p.v).toFixed(1);}).join(" ");
  var last = pts[pts.length-1];
  return '<div class="card"><div class="card-h"><h2>'+esc(title)+'</h2>'+
    '<span class="mono" style="margin-inline-start:auto;font-size:13px;color:var(--ink);font-weight:600">'+
      (isPct? last.v.toFixed(1)+"%" : fmt(last.v))+'</span></div>'+
    '<div class="card-b" style="padding:8px 6px">'+
    '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block" role="img" aria-label="'+esc(title)+'">'+
      '<path d="'+d+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>'+
      pts.map(function(p){return '<circle cx="'+x(p.i).toFixed(1)+'" cy="'+y(p.v).toFixed(1)+'" r="2.5" fill="var(--accent)"/>';}).join("")+
      labels.map(function(l,i){ return (i%2===0||i===labels.length-1) ?
        '<text x="'+x(i).toFixed(1)+'" y="'+(H-7)+'" font-size="9" fill="var(--muted)" text-anchor="middle" font-family="IBM Plex Mono">'+esc(l)+'</text>' : "";}).join("")+
    '</svg></div></div>';
}

function emptyState(){
  return '<div class="card"><div class="empty"><strong>'+esc(t("noFile"))+'</strong>'+esc(t("noFileB"))+'</div></div>';
}

function pageFiles(){
  var drop = '<div class="drop" id="drop"><div class="ic">XLSX</div>'+
    '<h3>'+esc(t("dropT"))+'</h3><p>'+esc(t("dropB"))+'</p>'+
    '<input type="file" id="fileInput" accept=".xlsx,.xls" multiple class="hide"></div>';
  if(!S.model) return drop;
  var rows = S.model.sheets.map(function(sh){
    return '<tr><td>'+esc(sh.name)+'</td>'+
      '<td class="n">'+(sh.skipped?t("nothing"):fmt(sh.lineItems.length))+'</td>'+
      '<td class="n">'+(sh.skipped?t("nothing"):fmt(sh.periods.length))+'</td>'+
      '<td class="mono" style="font-size:12px">'+(sh.skipped?t("nothing"):
        esc(sh.periods[0].label+" → "+sh.periods[sh.periods.length-1].label))+'</td>'+
      '<td>'+(sh.skipped?'<span class="sev info">skipped</span>':'<span class="sev" style="background:var(--ok-bg);color:var(--ok)">ok</span>')+'</td></tr>';
  }).join("");
  return drop +
   '<div class="card" style="margin-top:16px"><div class="card-h"><h2>'+esc(S.file.name)+'</h2>'+
   '<span class="mono" style="margin-inline-start:auto;font-size:12px;color:var(--muted)">'+
     esc(t("currency"))+" "+esc(S.model.currency)+'</span></div>'+
   '<table><thead><tr><th>'+esc(t("sheet"))+'</th><th style="text-align:end">'+esc(t("lineItems"))+
   '</th><th style="text-align:end">'+esc(t("periods"))+'</th><th>'+esc(t("detected"))+'</th><th></th></tr></thead>'+
   '<tbody>'+rows+'</tbody></table></div>';
}

function findingCard(f, compact){
  var nums = "";
  if(f.current !== null || f.comparison !== null){
    var isP = f.type==="variance"||f.type==="budget"||f.type==="margin";
    nums = '<div class="f-nums">'+
      (f.current!==null?'<div class="f-num"><div class="k">'+esc(t("current"))+'</div><div class="v">'+
        (f.type==="margin"?pctf(f.current):fmt(f.current))+'</div></div>':"")+
      (f.comparison!==null?'<div class="f-num"><div class="k">'+esc(t("comparison"))+'</div><div class="v">'+
        (f.type==="margin"?pctf(f.comparison):fmt(f.comparison))+'</div></div>':"")+
      (f.variance!==null?'<div class="f-num"><div class="k">'+esc(t("variance"))+'</div><div class="v'+
        (f.variance<0?" neg":"")+'">'+(isP?pctf(f.variance):fmt(f.variance))+'</div></div>':"")+
      (f.period?'<div class="f-num"><div class="k">'+esc(t("period"))+'</div><div class="v">'+esc(f.period)+'</div></div>':"")+
    '</div>';
  }
  var xrefs = f.cells.slice(0,4).map(function(c){
    return '<button class="xref" data-sheet="'+esc(f.sheet)+'" data-cell="'+esc(c)+'">'+
           esc(f.sheet)+' › '+esc(c)+'</button>'; }).join("");
  var actions = compact ? "" : '<div class="act">'+
      (f.status==="open"
        ? '<button data-act="investigating" data-id="'+f.id+'">'+esc(t("investigate"))+'</button>'+
          '<button data-act="reviewed" data-id="'+f.id+'">'+esc(t("markReviewed"))+'</button>'+
          '<button class="ok" data-act="approved" data-id="'+f.id+'">'+esc(t("approve"))+'</button>'
        : '<span class="status-tag '+f.status+'">'+esc(t(f.status))+'</span>'+
          '<button data-act="open" data-id="'+f.id+'">'+esc(t("reopen"))+'</button>')+
    '</div>';
  return '<article class="finding '+f.severity+(f.status!=="open"?" done":"")+'" data-fid="'+f.id+'">'+
    '<div class="f-h"><span class="sev '+f.severity+'"><span class="dot"></span>'+esc(f.severity)+'</span>'+
      '<div class="f-t"><h3>'+esc(f.metric||f.type)+'</h3><p>'+esc(lang==="ar"?f.ar:f.en)+'</p></div></div>'+
    nums +
    (f.calc?'<div class="f-calc">'+esc(t("calcLabel"))+": "+esc(f.calc)+'</div>':"")+
    '<div class="f-f">'+xrefs+actions+'</div></article>';
}

function pageReview(){
  if(!S.result) return emptyState();
  var F = S.result.findings.filter(function(f){
    if(S.filter==="open") return f.status==="open";
    if(S.filter==="crit") return f.severity==="critical";
    return true;
  });
  var bar = '<div class="card" style="margin-bottom:14px"><div class="card-b" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">'+
    ["all","open","crit"].map(function(k){
      return '<button class="tbtn'+(S.filter===k?" primary":"")+'" data-filter="'+k+'">'+
        esc(t(k==="all"?"filterAll":k==="open"?"filterOpen":"filterCrit"))+'</button>';}).join("")+
    '<span style="margin-inline-start:auto;display:flex;gap:8px">'+
    '<button class="tbtn" id="expJson">'+esc(t("exportJson"))+'</button>'+
    '<button class="tbtn" id="expCsv">'+esc(t("exportCsv"))+'</button></span>'+
    '</div></div>';
  if(!F.length) return bar + '<div class="card"><div class="empty"><strong>'+esc(t("allClear"))+'</strong>'+esc(t("allClearB"))+'</div></div>';
  return bar + F.map(function(f){ return findingCard(f, false); }).join("");
}

function noData(){
  return '<div class="card"><div class="empty"><strong>'+esc(t("noData"))+'</strong>'+esc(t("noDataB"))+'</div></div>';
}

/* ---------- deterministic narrative ---------- */
function pageReport(){
  if(!S.result) return emptyState();
  var sh = S.model.sheets.filter(function(x){return !x.skipped;})[0];
  if(!sh || !sh.periods.length) return noData();
  var cur = S.model.currency, F = S.result.findings;
  var get = function(cat){ return sh.lineItems.filter(function(l){return l.category===cat;})[0]; };
  var rev = get("revenue"), cogs = get("cogs"), ni = get("net_income");
  var P = sh.periods, last = P.length-1;
  var prev = last > 0 ? last-1 : null;   // null when the workbook holds one period
  var lines = [];

  function src(li, i){ return li && li.cells[i] ? '<span class="src">'+esc(t("srcLabel"))+": "+esc(sh.name)+" › "+esc(li.cells[i])+'</span>' : ""; }

  lines.push('<h2>'+esc(t("execSummary"))+'</h2>');
  lines.push('<p>'+ (lang==="ar"
    ? "تم فحص "+fmt(S.result.summary.checked)+" قيمة في "+esc(S.file.name)+". النتيجة: "+
      fmt(S.result.summary.critical)+" ملاحظة حرجة و"+fmt(S.result.summary.warning)+
      " تنبيهًا، بمؤشر جودة "+S.result.summary.score+"%."
    : "Checked "+fmt(S.result.summary.checked)+" values across "+esc(S.file.name)+". Result: "+
      fmt(S.result.summary.critical)+" critical finding(s) and "+fmt(S.result.summary.warning)+
      " warning(s), giving a data quality score of "+S.result.summary.score+"%.")+'</p>');

  if(rev){
    lines.push('<h2>'+esc(t("revenueH"))+'</h2>');
    var a = rev.values[last];
    var b = prev===null ? null : rev.values[prev];
    if(typeof a==="number" && typeof b==="number"){
      var d=(a-b)/Math.abs(b)*100;
      lines.push('<p>'+(lang==="ar"
        ? "بلغت المبيعات "+fmt(a)+" "+cur+" في "+esc(P[last].label)+"، بتغير "+d.toFixed(1)+
          "% مقارنة بـ "+fmt(b)+" في "+esc(P[prev].label)+". "
        : "Revenue was "+fmt(a)+" "+cur+" in "+esc(P[last].label)+", a change of "+d.toFixed(1)+
          "% against "+fmt(b)+" in "+esc(P[prev].label)+". ")+
        src(rev,last)+'</p>');
      lines.push('<div class="unknown">'+esc(t("insufficient"))+'</div>');
    } else if(typeof a==="number"){
      lines.push('<p>'+(lang==="ar" ? "بلغت المبيعات " : "Revenue was ")+fmt(a)+" "+cur+
        " ("+esc(P[last].label)+"). "+src(rev,last)+'</p>');
      if(prev===null) lines.push('<div class="unknown">'+esc(t("onePeriod"))+'</div>');
    }
  }

  if(rev && cogs){
    lines.push('<h2>'+esc(t("profitH"))+'</h2>');
    var gm = function(i){
      var r=rev.values[i], c=cogs.values[i];
      return (typeof r==="number" && typeof c==="number" && r) ? ((r-c)/r*100) : null; };
    var mNow = gm(last), mPrev = prev===null ? null : gm(prev);
    if(mNow!==null && mPrev!==null){
      lines.push('<p>'+(lang==="ar"
        ? "هامش الربح الإجمالي "+mNow.toFixed(1)+"% في "+esc(P[last].label)+" مقابل "+mPrev.toFixed(1)+"% في "+esc(P[prev].label)+". "
        : "Gross margin was "+mNow.toFixed(1)+"% in "+esc(P[last].label)+" against "+mPrev.toFixed(1)+"% in "+esc(P[prev].label)+". ")+
        '<span class="src">'+esc(t("calcLabel"))+": (Revenue - COGS) / Revenue</span></p>");
    } else if(mNow!==null){
      lines.push('<p>'+(lang==="ar" ? "هامش الربح الإجمالي " : "Gross margin was ")+mNow.toFixed(1)+
        "% ("+esc(P[last].label)+'). <span class="src">'+esc(t("calcLabel"))+
        ": (Revenue - COGS) / Revenue</span></p>");
    }
    if(ni && typeof ni.values[last]==="number")
      lines.push('<p>'+(lang==="ar"?"صافي الربح ":"Net income ")+fmt(ni.values[last])+" "+cur+". "+src(ni,last)+'</p>');
  }

  var big = F.filter(function(f){return f.type==="variance"||f.type==="budget";}).slice(0,5);
  if(big.length){
    lines.push('<h2>'+esc(t("expensesH"))+'</h2>');
    big.forEach(function(f){ lines.push('<p>'+esc(lang==="ar"?f.ar:f.en)+' <span class="src">'+
      esc(t("srcLabel"))+": "+esc(f.sheet)+" › "+esc(f.cells[0]||"")+'</span></p>'); });
  }

  var crits = F.filter(function(f){return f.severity==="critical";});
  lines.push('<h2>'+esc(t("issuesH"))+'</h2>');
  if(!crits.length) lines.push('<p>'+esc(t("allClearB"))+'</p>');
  crits.forEach(function(f){ lines.push('<p><strong>'+esc(f.metric)+'</strong> — '+
    esc(lang==="ar"?f.ar:f.en)+' <span class="src">'+esc(f.sheet)+" › "+esc(f.cells[0]||"")+'</span></p>'); });

  return '<div class="card"><div class="card-b report">'+lines.join("")+
    '<div class="unknown" style="margin-top:20px;background:var(--info-bg);border-color:var(--info);color:var(--info)">'+
    esc(t("aiNote"))+'</div></div></div>';
}

function pageSettings(){
  var c = Object.assign({}, FinSight.DEFAULTS, S.cfg);
  function row(k,label,val,step){
    return '<tr><td>'+esc(label)+'</td><td class="n"><input class="mono" style="width:110px;text-align:end;padding:5px 8px;border:1px solid var(--line-2);border-radius:4px;background:var(--card)" type="number" step="'+step+'" data-cfg="'+k+'" value="'+val+'"></td></tr>';
  }
  return '<div class="card"><div class="card-h"><h2>'+esc(t("thresholds"))+'</h2></div>'+
    '<table><tbody>'+
      row("revenueVariancePct", t("revThr"), c.revenueVariancePct, "0.01")+
      row("expenseVariancePct", t("expThr"), c.expenseVariancePct, "0.01")+
      row("balanceToleranceAbs", t("balTol"), c.balanceToleranceAbs, "1")+
      row("anomalyZ", t("anomZ"), c.anomalyZ, "0.1")+
      row("marginDropPts", t("marginPts"), c.marginDropPts, "0.5")+
    '</tbody></table>'+
    '<div class="card-b"><button class="tbtn primary" id="recheck">'+esc(t("recheck"))+'</button></div></div>';
}

/* ===================== cell inspector ===================== */
function openCell(sheetName, addr){
  var ws = S.wb.Sheets[sheetName]; if(!ws) return;
  var pos = XLSX.utils.decode_cell(addr);
  var r0=Math.max(0,pos.r-3), r1=pos.r+3, c0=Math.max(0,pos.c-2), c1=pos.c+2;
  var head='<tr><th></th>'; for(var c=c0;c<=c1;c++) head+='<th>'+XLSX.utils.encode_col(c)+'</th>'; head+='</tr>';
  var body="";
  for(var r=r0;r<=r1;r++){
    body+='<tr><td class="rowhdr">'+(r+1)+'</td>';
    for(var c2=c0;c2<=c1;c2++){
      var a=XLSX.utils.encode_cell({r:r,c:c2}), cell=ws[a];
      var v = cell ? (typeof cell.v==="number"?fmt(cell.v):String(cell.v)) : "";
      body+='<td class="'+(a===addr?"hit":"")+'">'+esc(v.length>18?v.slice(0,18)+"…":v)+'</td>';
    }
    body+='</tr>';
  }
  var cell = ws[addr]||{};
  el("insp").innerHTML =
    '<div class="insp-h"><h2>'+esc(t("cellInspector"))+'</h2>'+
    '<button class="x" id="inspX" aria-label="close">&times;</button></div>'+
    '<div style="padding:16px 18px">'+
      '<table style="margin-bottom:14px"><tbody>'+
        '<tr><td style="color:var(--muted)">'+esc(t("address"))+'</td><td class="mono">'+esc(sheetName)+" › "+esc(addr)+'</td></tr>'+
        '<tr><td style="color:var(--muted)">'+esc(t("value"))+'</td><td class="mono">'+
          esc(typeof cell.v==="number"?fmt(cell.v):String(cell.v==null?"":cell.v))+'</td></tr>'+
        '<tr><td style="color:var(--muted)">'+esc(t("formula"))+'</td><td class="mono" style="direction:ltr">'+
          (cell.f?"="+esc(cell.f):'<span style="color:var(--muted)">'+esc(t("noFormula"))+'</span>')+'</td></tr>'+
      '</tbody></table>'+
      '<div class="cellgrid"><table><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>'+
    '</div>';
  el("insp").classList.add("on"); el("scrim").classList.add("on");
  el("inspX").addEventListener("click", closeCell);
}
function closeCell(){ el("insp").classList.remove("on"); el("scrim").classList.remove("on"); }
el("scrim").addEventListener("click", closeCell);
document.addEventListener("keydown", function(e){ if(e.key==="Escape") closeCell(); });

/* ===================== render + wiring ===================== */
function render(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang==="ar" ? "rtl" : "ltr";
  document.documentElement.setAttribute("data-theme", theme);
  el("langBtn").textContent = lang==="ar" ? "English" : "العربية";
  el("themeBtn").textContent = theme==="dark" ? "Light" : "Dark";
  el("demoBtn").textContent = t("loadDemo");
  document.querySelectorAll("[data-t]").forEach(function(n){ n.textContent = t(n.getAttribute("data-t")); });
  el("pageTitle").textContent = t(S.page);
  renderNav();

  if(MISSING){ halt(esc(MISSING[0]), esc(MISSING[1])); return; }

  var v = el("view");
  try {
    v.innerHTML = S.page==="dash" ? pageDash()
      : S.page==="files" ? pageFiles()
      : S.page==="review" ? pageReview()
      : S.page==="report" ? pageReport()
      : pageSettings();
  } catch (err) {
    /* A page that throws should cost the user that page, not the session. */
    console.error("FinSight render error on page '" + S.page + "':", err);
    v.innerHTML = '<div class="card"><div class="card-b">'+
      '<h2 style="color:var(--crit);margin-bottom:6px">'+esc(t("crashed"))+'</h2>'+
      '<p class="note" style="margin-bottom:10px">'+esc(t("crashedB"))+'</p>'+
      '<pre class="mono" style="font-size:11.5px;white-space:pre-wrap;color:var(--crit);'+
      'background:var(--crit-bg);border:1px solid var(--crit-line);border-radius:6px;padding:10px;direction:ltr">'+
      esc(String(err && err.stack || err))+'</pre></div></div>';
  }

  try { wireDrop(); wireFindings(); wireSettings(); }
  catch (err) { console.error("FinSight wiring error:", err); }
}

function wireDrop(){
  var d = el("drop"), input = el("fileInput");
  if(!d) return;
  d.addEventListener("click", function(){ input.click(); });
  ["dragenter","dragover"].forEach(function(ev){
    d.addEventListener(ev, function(e){ e.preventDefault(); d.classList.add("over"); }); });
  ["dragleave","drop"].forEach(function(ev){
    d.addEventListener(ev, function(e){ e.preventDefault(); d.classList.remove("over"); }); });
  d.addEventListener("drop", function(e){ if(e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]); });
  input.addEventListener("change", function(){ if(input.files[0]) readFile(input.files[0]); });
}

function readFile(file){
  var fr = new FileReader();
  fr.onerror = function(){ alert(lang==="ar" ? "تعذر قراءة الملف." : "That file could not be read."); };
  fr.onload = function(e){
    var wb;
    try{
      wb = XLSX.read(new Uint8Array(e.target.result), {type:"array", cellFormula:true, cellDates:true});
    }catch(err){
      alert((lang==="ar" ? "تعذر فتح هذا الملف كملف Excel:\n\n" : "Could not open this as an Excel workbook:\n\n") + err.message);
      return;
    }
    /* SheetJS does not always throw on a non-spreadsheet — check the result
       is actually a workbook before handing it to the engine. */
    if(!wb || !wb.SheetNames || !wb.SheetNames.length){
      alert(lang==="ar"
        ? "هذا الملف لا يحتوي على أي أوراق عمل. تأكد أنه ملف .xlsx أو .xls صالح."
        : "That file contains no worksheets. Check it is a valid .xlsx or .xls file.");
      return;
    }
    try{
      analyse(wb, file.name);
      S.page = "dash"; render();
    }catch(err){
      console.error("FinSight analysis error:", err);
      alert((lang==="ar" ? "تعذر تحليل هذا الملف:\n\n" : "Could not analyse this workbook:\n\n") + err.message);
    }
  };
  fr.readAsArrayBuffer(file);
}

function wireFindings(){
  document.querySelectorAll(".xref").forEach(function(b){
    b.addEventListener("click", function(){ openCell(b.getAttribute("data-sheet"), b.getAttribute("data-cell")); });
  });
  document.querySelectorAll("[data-act]").forEach(function(b){
    b.addEventListener("click", function(){
      var f = S.result.findings.filter(function(x){return x.id===b.getAttribute("data-id");})[0];
      if(f){ f.status = b.getAttribute("data-act"); render(); }
    });
  });
  document.querySelectorAll("[data-filter]").forEach(function(b){
    b.addEventListener("click", function(){ S.filter = b.getAttribute("data-filter"); render(); });
  });
  if(el("expJson")) el("expJson").addEventListener("click", function(){
    download("finsight-findings.json", JSON.stringify(S.result, null, 2), "application/json"); });
  if(el("expCsv")) el("expCsv").addEventListener("click", function(){
    var head = ["id","severity","type","metric","period","sheet","cells","stated","computed","difference","status","note"];
    var rows = S.result.findings.map(function(f){
      return [f.id,f.severity,f.type,f.metric,f.period,f.sheet,f.cells.join(" "),
              f.current,f.comparison,f.variance,f.status,(lang==="ar"?f.ar:f.en)]
        .map(function(x){ return '"'+String(x==null?"":x).replace(/"/g,'""')+'"'; }).join(",");
    });
    download("finsight-findings.csv", "\ufeff"+[head.join(",")].concat(rows).join("\n"), "text/csv"); });
}

function wireSettings(){
  if(!el("recheck")) return;
  el("recheck").addEventListener("click", function(){
    document.querySelectorAll("[data-cfg]").forEach(function(i){ S.cfg[i.getAttribute("data-cfg")] = parseFloat(i.value); });
    if(S.model){ S.result = FinSight.validate(S.model, S.cfg); S.page="review"; }
    render();
  });
}

function download(name, text, mime){
  var b = new Blob([text], {type:mime});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = name; a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
}

el("langBtn").addEventListener("click", function(){
  lang = lang==="ar" ? "en" : "ar"; store.set("fs_lang", lang); render(); });
el("themeBtn").addEventListener("click", function(){
  theme = theme==="dark" ? "light" : "dark"; store.set("fs_theme", theme); render(); });
function b64ToBytes(b64){
  var bin = atob(b64), out = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}
function embeddedDemo(){
  var n = document.getElementById("demoXlsx");
  if(!n) return null;
  var b = n.textContent.replace(/\s+/g, "");
  return (!b || b.indexOf("__DEMO") === 0) ? null : b;
}

el("demoBtn").addEventListener("click", function(){
  /* The demo workbook is embedded in this file, so it works offline, from
     disk, and inside a preview pane. Fetch is only a fallback. */
  var b64 = embeddedDemo();
  if(b64){
    try{
      analyse(XLSX.read(b64ToBytes(b64), {type:"array", cellFormula:true, cellDates:true}),
              "finsight-demo-workbook.xlsx");
      S.page = "dash"; render();
    }catch(err){
      console.error("FinSight demo error:", err);
      alert("Could not read the embedded demo workbook:\n\n" + err.message);
    }
    return;
  }
  if(location.protocol === "file:"){
    alert(lang==="ar"
      ? "المتصفح يمنع قراءة الملفات تلقائيًا عند فتح الصفحة من القرص مباشرة.\n\n"+
        "اسحب ملف finsight-demo-workbook.xlsx إلى منطقة الرفع في تبويب الملفات — سيعمل بشكل طبيعي.\n\n"+
        "أو شغّل خادمًا محليًا:  python3 -m http.server"
      : "Browsers block reading files automatically when a page is opened straight from disk.\n\n"+
        "Drag finsight-demo-workbook.xlsx onto the upload area in the Files tab instead — that works normally.\n\n"+
        "Or serve the folder:  python3 -m http.server");
    S.page = "files"; render();
    return;
  }
  fetch("finsight-demo-workbook.xlsx").then(function(r){
    if(!r.ok) throw new Error("HTTP " + r.status);
    return r.arrayBuffer(); })
  .then(function(buf){
    analyse(XLSX.read(new Uint8Array(buf), {type:"array", cellFormula:true, cellDates:true}),
            "finsight-demo-workbook.xlsx");
    S.page="dash"; render(); })
  .catch(function(e){
    alert("Could not load the demo workbook. Keep finsight-demo-workbook.xlsx in the same folder as this page.\n\n"+e.message);
    S.page="files"; render(); });
});

window.__FS = S;   // exposed for the test harness
render();
})();
</script>
