<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Production desk — El Shams</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E1729">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16233D; --ink-deep:#0E1729;
  --amber:#E8A33D; --gold:#F4C16B;
  --surface:#EEF1F5; --card:#fff;
  --line:#D5DCE6; --line-soft:#E7ECF2;
  --muted:#5C6B85; --muted-2:#8494AC;
  --done:#2E7D5B; --hold:#B03A2E;
  --r:4px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;
  background:var(--surface);color:var(--ink);line-height:1.5;font-size:14.5px;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* ---------- sign in ---------- */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px;
  background:var(--ink-deep);
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.03) 0 2px,transparent 2px 7px);}
.gate-card{background:var(--card);border-radius:var(--r);padding:32px;width:100%;max-width:370px;
  box-shadow:0 12px 40px rgba(0,0,0,.3)}
.gate-logo{width:96px;height:auto;display:block;margin-bottom:18px}
.gate-card h1{font-size:20px;font-weight:600;margin-bottom:4px}
.gate-card p.sub{color:var(--muted);font-size:13.5px;margin-bottom:22px}

label.lbl{display:block;font-size:12.5px;font-weight:500;color:var(--muted);margin:0 0 6px}
.inp{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:var(--r);
  background:#FBFCFD;transition:.15s}
.inp:focus{outline:none;border-color:var(--ink);background:#fff}
textarea.inp{min-height:64px;resize:vertical;line-height:1.5}
.stack>*+*{margin-top:14px}

.btn{padding:10px 18px;border:none;border-radius:var(--r);cursor:pointer;font-weight:600;
  background:var(--ink);color:#fff;transition:.15s}
.btn:hover{background:var(--ink-deep)}
.btn:disabled{opacity:.5;cursor:default}
.btn.wide{width:100%}
.btn.amber{background:var(--amber);color:var(--ink-deep)}
.btn.amber:hover{background:#DB9630}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.ghost:hover{background:#F4F6F9}
.btn.danger{background:transparent;color:var(--hold);border:1px solid #E8C4BF;font-weight:500}
.btn.danger:hover{background:#FDF4F3}
.btn.sm{padding:7px 13px;font-size:13px}

.err{background:#FDF4F3;color:var(--hold);border:1px solid #F3D9D5;border-radius:var(--r);
  padding:10px 12px;font-size:13.5px;margin-top:14px}

/* ---------- app shell ---------- */
.app{display:none;min-height:100vh;flex-direction:column}
.app.on{display:flex}

.topbar{background:var(--ink-deep);
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 2px,transparent 2px 7px);
  color:#fff;border-bottom:3px solid var(--amber);padding:11px 18px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.tb-brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto}
.tb-logo{width:46px;height:auto;flex:none;display:block}
.tb-title{font-size:13.5px;font-weight:600;letter-spacing:.12em}
.tb-sub{font-size:10.5px;color:var(--gold);letter-spacing:.05em}
.tb-user{font-size:12.5px;color:rgba(255,255,255,.7)}
.tb-btn{background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;
  padding:6px 12px;border-radius:var(--r);cursor:pointer;font-size:12.5px;transition:.15s}
.tb-btn:hover{background:rgba(255,255,255,.1);border-color:var(--gold)}

.toolbar{background:var(--card);border-bottom:1px solid var(--line);padding:12px 18px;
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
#q{flex:1 1 220px;min-width:0;padding:9px 12px;border:1.5px solid var(--line);
  border-radius:var(--r);background:#FBFCFD}
#q:focus{outline:none;border-color:var(--ink);background:#fff}
.sel{padding:9px 10px;border:1.5px solid var(--line);border-radius:var(--r);background:#FBFCFD;cursor:pointer}
.count{font-size:12.5px;color:var(--muted-2);font-family:"IBM Plex Mono",monospace}

.content{flex:1;padding:18px}

/* ---------- table ---------- */
.tablewrap{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:auto}
table{width:100%;border-collapse:collapse;min-width:820px}
thead th{
  text-align:start;font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted-2);font-weight:500;
  padding:11px 13px;border-bottom:1px solid var(--line);background:#FAFBFC;white-space:nowrap}
tbody td{padding:11px 13px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tbody tr{cursor:pointer;transition:background .1s}
tbody tr:hover{background:#F6F8FB}
tbody tr:last-child td{border-bottom:none}
.c-code{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:13.5px;white-space:nowrap}
.c-sub{font-size:12px;color:var(--muted-2);margin-top:2px}
.chip{display:inline-block;padding:3px 9px;border-radius:11px;font-size:12px;font-weight:500;white-space:nowrap}
.chip.stage{background:#E9EEF5;color:var(--ink)}
.chip.stage.cur{background:var(--gold);color:var(--ink-deep)}
.chip.active{background:#E9EEF5;color:var(--ink)}
.chip.on_hold{background:#FBE6E3;color:var(--hold)}
.chip.completed{background:#DFEEE7;color:var(--done)}
.chip.cancelled{background:#EDEFF2;color:var(--muted-2)}
.swatch-sm{width:15px;height:15px;border-radius:2px;border:1px solid rgba(0,0,0,.18);
  display:inline-block;vertical-align:-3px;margin-inline-end:6px;
  background-image:repeating-linear-gradient(45deg,#D5DCE6 0 3px,#E7ECF2 3px 6px)}
.late{color:var(--hold);font-weight:500}

.empty{padding:52px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;font-size:16px;color:var(--ink);margin-bottom:5px;font-weight:600}

/* ---------- drawer / modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(14,23,41,.5);z-index:20;display:none}
.scrim.on{display:block}
.panel{position:fixed;inset-block:0;inset-inline-end:0;width:min(560px,100%);
  background:var(--surface);z-index:21;overflow-y:auto;display:none;
  box-shadow:-8px 0 32px rgba(0,0,0,.2)}
.panel.on{display:block;animation:slide .25s cubic-bezier(.2,.7,.3,1) both}
@keyframes slide{from{transform:translateX(var(--from,100%))}to{transform:none}}
html[dir="rtl"] .panel.on{--from:-100%}

.p-head{background:var(--ink-deep);color:#fff;padding:16px 18px;position:sticky;top:0;z-index:2;
  display:flex;align-items:flex-start;gap:12px}
.p-code{font-family:"IBM Plex Mono",monospace;font-size:17px;font-weight:600;letter-spacing:.06em}
.p-cust{font-size:13px;color:rgba(255,255,255,.7);margin-top:2px}
.x{margin-inline-start:auto;background:transparent;border:none;color:#fff;font-size:22px;
  cursor:pointer;line-height:1;padding:2px 6px;opacity:.8}
.x:hover{opacity:1}

.block{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  margin:14px 14px 0;padding:16px}
.block h3{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted-2);font-weight:500;margin-bottom:12px}
.row{display:flex;gap:9px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}

.tl{list-style:none;position:relative}
.tl li{position:relative;padding-inline-start:22px;padding-bottom:14px}
.tl li:last-child{padding-bottom:0}
.tl li::before{content:"";position:absolute;inset-inline-start:4px;top:14px;bottom:-2px;
  border-inline-start:1px solid var(--line)}
.tl li:last-child::before{display:none}
.tl .d{position:absolute;inset-inline-start:0;top:5px;width:9px;height:9px;border-radius:50%;
  background:var(--ink)}
.tl .d.note{background:var(--amber)}
.tl .d.status{background:var(--muted-2)}
.tl-t{font-size:14px;font-weight:500}
.tl-w{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted-2);margin-top:1px}
.tl-n{font-size:13px;color:var(--muted);margin-top:3px}

#qrbox{text-align:center;padding-top:4px}
#qrbox canvas{border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:8px}
.linkline{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted);
  word-break:break-all;margin-top:8px}

.toast{position:fixed;inset-block-end:20px;inset-inline-start:50%;transform:translateX(-50%);
  background:var(--ink-deep);color:#fff;padding:11px 20px;border-radius:var(--r);
  font-size:13.5px;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

var lang = (localStorage.getItem("els_lang")==="ar") ? "ar" : "en";
function t(k){ return (T[lang]&&T[lang][k]) || T.en[k] || k; }
function loc(){ return lang==="ar" ? "ar-EG-u-nu-latn" : "en-GB"; }

/* ================= helpers ================= */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function fdate(v){ if(!v)return""; var d=new Date(v); if(isNaN(d))return"";
  return new Intl.DateTimeFormat(loc(),{day:"2-digit",month:"short",year:"numeric"}).format(d);}
function fdt(v){ if(!v)return""; var d=new Date(v); if(isNaN(d))return"";
  return new Intl.DateTimeFormat(loc(),{day:"2-digit",month:"short",year:"numeric",
    hour:"2-digit",minute:"2-digit"}).format(d);}
function fnum(v){ if(v===null||v===undefined||v==="")return"";
  var n=Number(v); if(isNaN(n))return""; return new Intl.NumberFormat(loc(),{maximumFractionDigits:2}).format(n);}
function el(id){return document.getElementById(id);}
function toast(m){ var x=el("toast"); x.textContent=m; x.classList.add("on");
  clearTimeout(x._t); x._t=setTimeout(function(){x.classList.remove("on");},2200);}
function isHex(h){return /^#[0-9A-Fa-f]{6}$/.test(String(h||"").trim());}

/* ================= state ================= */
var STAGES = [], ORDERS = [], ME = null, IS_ADMIN = false, OPEN = null;

function routeStages(route){
  return STAGES.filter(function(s){
    if(route==="dyeing")   return s.in_dyeing;
    if(route==="printing") return s.in_printing;
    return s.in_dyeing || s.in_printing;
  });
}
function stageName(id){
  var s = STAGES.filter(function(x){return x.id===id;})[0];
  return s ? (lang==="ar"?s.name_ar:s.name_en) : "—";
}

/* ================= sign in ================= */
async function trySession(){
  var s = await sb.auth.getSession();
  if(s.data.session) await enter(s.data.session.user);
}
async function enter(user){
  var r = await sb.from("staff").select("full_name, role, is_active").eq("id", user.id).maybeSingle();
  if(r.error || !r.data || !r.data.is_active){
    el("gateErr").innerHTML = '<div class="err">'+esc(t("noAccess"))+'</div>';
    await sb.auth.signOut();
    return;
  }
  ME = { id:user.id, email:user.email, name:r.data.full_name || user.email, role:r.data.role };
  IS_ADMIN = r.data.role === "admin";
  el("gate").style.display = "none";
  el("app").classList.add("on");
  el("who").textContent = ME.name;
  await loadStages();
  await loadOrders();
}

el("signin").addEventListener("click", async function(){
  var b=this; b.disabled=true; el("gateErr").innerHTML="";
  var r = await sb.auth.signInWithPassword({ email: el("email").value.trim(), password: el("pw").value });
  b.disabled=false;
  if(r.error){ el("gateErr").innerHTML='<div class="err">'+esc(t("badLogin"))+'</div>'; return; }
  await enter(r.data.user);
});
el("pw").addEventListener("keydown",function(e){ if(e.key==="Enter") el("signin").click(); });
el("signout").addEventListener("click", async function(){ await sb.auth.signOut(); location.reload(); });

/* ================= data ================= */
async function loadStages(){
  var r = await sb.from("stages").select("*").order("sort_order");
  if(!r.error) STAGES = r.data || [];
  buildFilters();
}
async function loadOrders(){
  var r = await sb.from("orders").select("*").order("updated_at",{ascending:false});
  if(r.error){ toast(r.error.message); return; }
  ORDERS = r.data || [];
  draw();
}

/* ================= filters + table ================= */
function buildFilters(){
  var fs = el("fStatus");
  fs.innerHTML = '<option value="">'+esc(t("allStatus"))+'</option>' +
    ["active","on_hold","completed","cancelled"].map(function(s){
      return '<option value="'+s+'">'+esc(t(s))+'</option>'; }).join("");
  var fg = el("fStage");
  fg.innerHTML = '<option value="">'+esc(t("allStage"))+'</option>' +
    STAGES.map(function(s){
      return '<option value="'+s.id+'">'+esc(lang==="ar"?s.name_ar:s.name_en)+'</option>'; }).join("");
}

function filtered(){
  var q  = el("q").value.trim().toLowerCase();
  var st = el("fStatus").value, sg = el("fStage").value;
  return ORDERS.filter(function(o){
    if(st && o.status!==st) return false;
    if(sg && String(o.current_stage_id)!==sg) return false;
    if(!q) return true;
    return [o.tracking_code,o.customer_name,o.customer_ref,o.fabric_type,o.color_name]
      .filter(Boolean).join(" ").toLowerCase().indexOf(q) > -1;
  });
}

function draw(){
  el("thead").innerHTML = ["thCode","thCustomer","thFabric","thQty","thStage","thStatus","thDue","thUpdated"]
    .map(function(k){ return "<th>"+esc(t(k))+"</th>"; }).join("");

  var rows = filtered();
  el("count").textContent = rows.length + " / " + ORDERS.length;
  var tb = el("tbody"), emp = el("empty");

  if(!rows.length){
    tb.innerHTML = "";
    emp.style.display = "block";
    var none = ORDERS.length === 0;
    emp.innerHTML = "<strong>"+esc(t(none?"noneT":"emptyT"))+"</strong>"+esc(t(none?"noneB":"emptyB"));
    return;
  }
  emp.style.display = "none";

  var today = new Date(new Date().toDateString());
  tb.innerHTML = rows.map(function(o){
    var qty = [ fnum(o.quantity_kg)?fnum(o.quantity_kg)+" kg":"", fnum(o.quantity_m)?fnum(o.quantity_m)+" m":"" ]
                .filter(Boolean).join(" / ");
    var overdue = o.promised_date && o.status!=="completed" && o.status!=="cancelled" &&
                  new Date(o.promised_date) < today;
    var sw = isHex(o.color_hex)
      ? '<span class="swatch-sm" style="background-image:none;background-color:'+esc(o.color_hex)+'"></span>'
      : '<span class="swatch-sm"></span>';
    return '<tr data-id="'+esc(o.id)+'">'+
      '<td><div class="c-code">'+esc(o.tracking_code)+'</div>'+
        '<div class="c-sub">'+esc(t(o.route))+'</div></td>'+
      '<td>'+esc(o.customer_name)+
        (o.customer_ref?'<div class="c-sub mono">'+esc(o.customer_ref)+'</div>':'')+'</td>'+
      '<td>'+sw+esc(o.fabric_type||"—")+
        (o.color_name?'<div class="c-sub">'+esc(o.color_name)+'</div>':'')+'</td>'+
      '<td class="mono" style="font-size:13px">'+esc(qty||"—")+'</td>'+
      '<td><span class="chip stage cur">'+esc(stageName(o.current_stage_id))+'</span></td>'+
      '<td><span class="chip '+esc(o.status)+'">'+esc(t(o.status))+'</span></td>'+
      '<td class="mono '+(overdue?"late":"")+'" style="font-size:13px;white-space:nowrap">'+
        esc(fdate(o.promised_date)||"—")+'</td>'+
      '<td class="mono" style="font-size:12px;color:var(--muted);white-space:nowrap">'+
        esc(fdt(o.updated_at))+'</td>'+
    '</tr>';
  }).join("");

  Array.prototype.forEach.call(tb.querySelectorAll("tr"), function(tr){
    tr.addEventListener("click", function(){ openOrder(tr.getAttribute("data-id")); });
  });
}

["q","fStatus","fStage"].forEach(function(id){
  el(id).addEventListener("input", draw);
  el(id).addEventListener("change", draw);
});
el("refresh").addEventListener("click", loadOrders);

/* ================= panel ================= */
function closePanel(){
  el("panel").classList.remove("on");
  el("scrim").classList.remove("on");
  OPEN = null;
}
el("scrim").addEventListener("click", closePanel);
document.addEventListener("keydown", function(e){ if(e.key==="Escape") closePanel(); });

function field(id,label,value,type,extra){
  return '<div><label class="lbl" for="'+id+'">'+esc(label)+'</label>'+
    '<input class="inp" id="'+id+'" type="'+(type||"text")+'" value="'+esc(value==null?"":value)+'" '+(extra||"")+'></div>';
}
function hexField(id,label,value){
  var v = isHex(value) ? value.toUpperCase() : "";
  return '<div><label class="lbl" for="'+id+'">'+esc(label)+'</label>'+
    '<div style="display:flex;gap:6px">'+
      '<input class="inp" id="'+id+'" type="text" maxlength="7" placeholder="'+esc(t("noShade"))+'" value="'+esc(v)+'">'+
      '<input id="'+id+'P" type="color" value="'+(v||"#CCCCCC")+'" aria-label="'+esc(label)+'" '+
        'style="width:44px;flex:none;padding:2px;border:1.5px solid var(--line);border-radius:var(--r);background:#FBFCFD;cursor:pointer">'+
    '</div></div>';
}
function wireHex(id){
  var txt = el(id), pick = el(id+"P");
  if(!txt || !pick) return;
  pick.addEventListener("input", function(){ txt.value = pick.value.toUpperCase(); });
  txt.addEventListener("input", function(){ if(isHex(txt.value.trim())) pick.value = txt.value.trim(); });
}
function hexVal(id){ var v = (el(id).value||"").trim(); return isHex(v) ? v.toUpperCase() : null; }

function area(id,label,value){
  return '<div><label class="lbl" for="'+id+'">'+esc(label)+'</label>'+
    '<textarea class="inp" id="'+id+'">'+esc(value==null?"":value)+'</textarea></div>';
}

async function openOrder(id){
  var o = ORDERS.filter(function(x){return x.id===id;})[0];
  if(!o) return;
  OPEN = o;
  el("scrim").classList.add("on");
  var p = el("panel");
  p.classList.add("on");
  p.scrollTop = 0;

  var rs = routeStages(o.route);
  var idx = -1; rs.forEach(function(s,i){ if(s.id===o.current_stage_id) idx=i; });
  var next = (idx>-1 && idx < rs.length-1) ? rs[idx+1] : null;
  var link = (CFG.TRACK_URL||"") + "?code=" + encodeURIComponent(o.tracking_code);

  p.innerHTML =
  '<div class="p-head">'+
    '<div><div class="p-code">'+esc(o.tracking_code)+'</div>'+
    '<div class="p-cust">'+esc(o.customer_name)+' · '+esc(t(o.route))+'</div></div>'+
    '<button class="x" id="pClose" aria-label="'+esc(t("close"))+'">&times;</button>'+
  '</div>'+

  /* --- move --- */
  '<div class="block"><h3>'+esc(t("quick"))+'</h3>'+
    '<div class="row">'+
      (next
        ? '<button class="btn amber" id="adv">'+esc(t("advance"))+' → '+esc(lang==="ar"?next.name_ar:next.name_en)+'</button>'
        : '<span style="color:var(--muted);font-size:13.5px;align-self:center">'+esc(t("atEnd"))+'</span>')+
      (o.status==="on_hold"
        ? '<button class="btn ghost" id="resume">'+esc(t("resume"))+'</button>'
        : '<button class="btn ghost" id="hold">'+esc(t("hold"))+'</button>')+
      (o.status==="completed"
        ? '<button class="btn ghost" id="reopen">'+esc(t("reopen"))+'</button>'
        : '<button class="btn ghost" id="done">'+esc(t("complete"))+'</button>')+
      (o.status!=="cancelled" ? '<button class="btn ghost" id="cancel">'+esc(t("cancel"))+'</button>' : "")+
    '</div>'+
    '<div style="margin-top:14px">'+
      '<label class="lbl" for="jump">'+esc(t("jump"))+'</label>'+
      '<select class="sel" id="jump" style="width:100%">'+
        rs.map(function(s){
          return '<option value="'+s.id+'"'+(s.id===o.current_stage_id?" selected":"")+'>'+
                 esc(lang==="ar"?s.name_ar:s.name_en)+'</option>'; }).join("")+
      '</select>'+
    '</div>'+
  '</div>'+

  /* --- note --- */
  '<div class="block"><h3>'+esc(t("addNote"))+'</h3>'+
    '<div class="grid2">'+
      area("nEn", t("noteEn"), "")+
      area("nAr", t("noteAr"), "")+
    '</div>'+
    '<div class="row" style="margin-top:12px"><button class="btn sm" id="postNote">'+esc(t("postNote"))+'</button></div>'+
  '</div>'+

  /* --- timeline --- */
  '<div class="block"><h3>'+esc(t("timeline"))+'</h3><div id="tlBox">…</div></div>'+

  /* --- details --- */
  '<div class="block"><h3>'+esc(t("details"))+'</h3>'+
    '<div class="grid2">'+
      field("fCust", t("customer"), o.customer_name)+
      field("fRef",  t("ref"), o.customer_ref)+
      '<div><label class="lbl" for="fRoute">'+esc(t("route"))+'</label>'+
        '<select class="inp" id="fRoute">'+
          ["dyeing","printing","both"].map(function(r){
            return '<option value="'+r+'"'+(o.route===r?" selected":"")+'>'+esc(t(r))+'</option>'; }).join("")+
        '</select></div>'+
      field("fFab",  t("fabric"), o.fabric_type)+
      field("fCol",  t("colorName"), o.color_name)+
      hexField("fHex", t("colorHex"), o.color_hex)+
      field("fKg",   t("kg"), o.quantity_kg, "number", 'step="0.01" min="0"')+
      field("fM",    t("m"),  o.quantity_m,  "number", 'step="0.01" min="0"')+
      field("fOd",   t("odate"), o.order_date, "date")+
      field("fPd",   t("pdate"), o.promised_date, "date")+
    '</div>'+
    '<div class="grid2" style="margin-top:12px">'+
      area("fPubEn", t("pubEn"), o.public_note_en)+
      area("fPubAr", t("pubAr"), o.public_note_ar)+
    '</div>'+
    '<div style="margin-top:12px">'+area("fInt", t("internal"), o.internal_note)+'</div>'+
    '<div class="row" style="margin-top:14px"><button class="btn" id="save">'+esc(t("save"))+'</button></div>'+
  '</div>'+

  /* --- share --- */
  '<div class="block"><h3>'+esc(t("share"))+'</h3>'+
    '<div id="qrbox"></div>'+
    '<div class="linkline">'+esc(link)+'</div>'+
    '<div class="row" style="margin-top:12px">'+
      '<button class="btn sm ghost" id="copy">'+esc(t("copy"))+'</button>'+
      '<button class="btn sm ghost" id="printQr">'+esc(t("print"))+'</button>'+
    '</div>'+
  '</div>'+

  (IS_ADMIN
    ? '<div class="block" style="margin-bottom:20px"><h3>'+esc(t("danger"))+'</h3>'+
      '<button class="btn danger sm" id="del">'+esc(t("danger"))+'</button></div>'
    : '<div style="height:20px"></div>');

  el("pClose").addEventListener("click", closePanel);
  wireHex("fHex");

  /* actions */
  if(next) el("adv").addEventListener("click", function(){ patch(o.id,{current_stage_id: next.id, status: o.status==="on_hold"?"active":o.status}); });
  el("jump").addEventListener("change", function(){ patch(o.id,{current_stage_id: Number(this.value)}); });
  if(el("hold"))   el("hold").addEventListener("click",   function(){ patch(o.id,{status:"on_hold"}); });
  if(el("resume")) el("resume").addEventListener("click", function(){ patch(o.id,{status:"active"}); });
  if(el("done"))   el("done").addEventListener("click",   function(){ patch(o.id,{status:"completed"}); });
  if(el("reopen")) el("reopen").addEventListener("click", function(){ patch(o.id,{status:"active"}); });
  if(el("cancel")) el("cancel").addEventListener("click", function(){ patch(o.id,{status:"cancelled"}); });

  el("postNote").addEventListener("click", async function(){
    var en = el("nEn").value.trim(), ar = el("nAr").value.trim();
    if(!en && !ar) return;
    var r = await sb.from("order_events").insert({
      order_id:o.id, stage_id:o.current_stage_id, event_type:"note",
      note_en:en||null, note_ar:ar||null, created_by:ME.id });
    if(r.error){ toast(r.error.message); return; }
    toast(t("saved")); openOrder(o.id);
  });

  el("save").addEventListener("click", async function(){
    var name = el("fCust").value.trim();
    if(!name){ toast(t("needCustomer")); return; }
    patch(o.id,{
      customer_name:name,
      customer_ref: el("fRef").value.trim() || null,
      route: el("fRoute").value,
      fabric_type: el("fFab").value.trim() || null,
      color_name: el("fCol").value.trim() || null,
      color_hex: hexVal("fHex"),
      quantity_kg: el("fKg").value === "" ? null : Number(el("fKg").value),
      quantity_m:  el("fM").value  === "" ? null : Number(el("fM").value),
      order_date: el("fOd").value || null,
      promised_date: el("fPd").value || null,
      public_note_en: el("fPubEn").value.trim() || null,
      public_note_ar: el("fPubAr").value.trim() || null,
      internal_note: el("fInt").value.trim() || null
    });
  });

  el("copy").addEventListener("click", function(){
    navigator.clipboard.writeText(link).then(function(){ toast(t("copied")); });
  });
  el("printQr").addEventListener("click", function(){ printQr(o, link); });

  if(el("del")) el("del").addEventListener("click", async function(){
    if(!confirm(t("confirmDel"))) return;
    var r = await sb.from("orders").delete().eq("id", o.id);
    if(r.error){ toast(r.error.message); return; }
    closePanel(); loadOrders();
  });

  if(window.QRCode) QRCode.toCanvas(link,{width:150,margin:1,color:{dark:"#16233D",light:"#ffffff"}},
    function(e,c){ if(!e) el("qrbox").appendChild(c); });

  loadTimeline(o.id);
}

async function loadTimeline(id){
  var r = await sb.from("order_events").select("*").eq("order_id",id).order("happened_at",{ascending:false});
  var box = el("tlBox"); if(!box) return;
  if(r.error){ box.textContent = r.error.message; return; }
  box.innerHTML = '<ul class="tl">' + (r.data||[]).map(function(e){
    var title, cls="";
    if(e.event_type==="created")      title = t("created");
    else if(e.event_type==="stage")   title = t("stageTo")+" "+stageName(e.stage_id);
    else if(e.event_type==="status"){ title = t("statusEv")+" "+t(e.note_en||""); cls="status"; }
    else { title = t("noteEv"); cls="note"; }
    var n = (lang==="ar"?e.note_ar:e.note_en) || (e.event_type==="note" ? (e.note_ar||e.note_en) : "");
    return '<li><span class="d '+cls+'"></span>'+
      '<div class="tl-t">'+esc(title)+'</div>'+
      '<div class="tl-w">'+esc(fdt(e.happened_at))+'</div>'+
      (e.event_type==="note" && n ? '<div class="tl-n">'+esc(n)+'</div>' : "")+
    '</li>';
  }).join("") + '</ul>';
}

async function patch(id, obj){
  var r = await sb.from("orders").update(obj).eq("id",id).select().single();
  if(r.error){ toast(r.error.message); return; }
  ORDERS = ORDERS.map(function(o){ return o.id===id ? r.data : o; });
  draw();
  toast(t("saved"));
  openOrder(id);
}

/* ================= new order ================= */
el("newBtn").addEventListener("click", function(){
  el("scrim").classList.add("on");
  var p = el("panel"); p.classList.add("on"); p.scrollTop = 0;
  var today = new Date().toISOString().slice(0,10);

  p.innerHTML =
  '<div class="p-head"><div><div class="p-code">'+esc(t("newT"))+'</div>'+
  '<div class="p-cust">'+esc(t("noneB"))+'</div></div>'+
  '<button class="x" id="pClose">&times;</button></div>'+
  '<div class="block" style="margin-bottom:20px">'+
    '<div class="grid2">'+
      field("nCust", t("customer"), "")+
      field("nRef",  t("ref"), "")+
      '<div><label class="lbl" for="nRoute">'+esc(t("route"))+'</label>'+
        '<select class="inp" id="nRoute">'+
          ["dyeing","printing","both"].map(function(r){
            return '<option value="'+r+'">'+esc(t(r))+'</option>'; }).join("")+
        '</select></div>'+
      field("nFab", t("fabric"), "")+
      field("nCol", t("colorName"), "")+
      hexField("nHex", t("colorHex"), "")+
      field("nKg",  t("kg"), "", "number", 'step="0.01" min="0"')+
      field("nM",   t("m"),  "", "number", 'step="0.01" min="0"')+
      field("nOd",  t("odate"), today, "date")+
      field("nPd",  t("pdate"), "", "date")+
    '</div>'+
    '<div class="row" style="margin-top:16px"><button class="btn amber" id="create">'+esc(t("create"))+'</button></div>'+
  '</div>';

  el("pClose").addEventListener("click", closePanel);
  wireHex("nHex");
  el("create").addEventListener("click", async function(){
    var name = el("nCust").value.trim();
    if(!name){ toast(t("needCustomer")); el("nCust").focus(); return; }
    this.disabled = true;
    var r = await sb.from("orders").insert({
      customer_name:name,
      customer_ref: el("nRef").value.trim() || null,
      route: el("nRoute").value,
      fabric_type: el("nFab").value.trim() || null,
      color_name: el("nCol").value.trim() || null,
      color_hex: hexVal("nHex"),
      quantity_kg: el("nKg").value === "" ? null : Number(el("nKg").value),
      quantity_m:  el("nM").value  === "" ? null : Number(el("nM").value),
      order_date: el("nOd").value || null,
      promised_date: el("nPd").value || null,
      created_by: ME.id
    }).select().single();
    this.disabled = false;
    if(r.error){ toast(r.error.message); return; }
    ORDERS.unshift(r.data); draw();
    toast(t("created2") + " · " + r.data.tracking_code);
    openOrder(r.data.id);
  });
  el("nCust").focus();
});

/* ================= QR print sheet ================= */
function logoMarkup(){
  var n = document.querySelector(".tb-logo");
  return n ? n.outerHTML.replace('class="tb-logo"','class="lg"') : "";
}
function printQr(o, link){
  if(!window.QRCode){ toast(t("noQr")); return; }
  QRCode.toDataURL(link,{width:520,margin:1,color:{dark:"#16233D",light:"#ffffff"}},function(err,url){
    if(err){ toast(String(err)); return; }
    var w = window.open("","_blank");
    if(!w){ toast("Allow pop-ups to print."); return; }
    w.document.write(
      '<!doctype html><html><head><meta charset="utf-8"><title>'+esc(o.tracking_code)+'</title>'+
      '<style>@page{size:A6;margin:8mm}'+
      'body{font-family:system-ui,sans-serif;text-align:center;color:#16233D;margin:0}'+
      '.lg{width:104px;height:auto;display:block;margin:0 auto 6px}'+
      'h1{font-size:15px;letter-spacing:.15em;margin:0 0 2px}'+
      '.s{font-size:9px;color:#5C6B85;margin-bottom:10px}'+
      'img{width:150px;height:150px}'+
      '.c{font-family:ui-monospace,monospace;font-size:19px;font-weight:700;letter-spacing:.08em;margin-top:8px}'+
      '.n{font-size:11px;color:#5C6B85;margin-top:4px}'+
      '.u{font-family:ui-monospace,monospace;font-size:8px;color:#8494AC;margin-top:8px;word-break:break-all}'+
      '</style></head><body>'+
      logoMarkup()+
      '<h1>EL SHAMS</h1><div class="s">Scan to track your order · امسح لتتبع طلبك</div>'+
      '<img src="'+url+'" alt="">'+
      '<div class="c">'+esc(o.tracking_code)+'</div>'+
      '<div class="n">'+esc(o.customer_name)+(o.customer_ref?" · "+esc(o.customer_ref):"")+'</div>'+
      '<div class="u">'+esc(link)+'</div>'+
      '</body></html>');
    w.document.close();
    setTimeout(function(){ w.print(); }, 350);
  });
}

/* ================= language ================= */
function applyLang(){
  document.documentElement.lang = lang;
  document.documentElement.dir  = lang==="ar" ? "rtl" : "ltr";
  el("langBtn").textContent = lang==="ar" ? "English" : "العربية";
  el("gt1").textContent = t("signinT");  el("gt2").textContent = t("signinS");
  el("gt3").textContent = t("email");    el("gt4").textContent = t("pw");
  el("signin").textContent = t("signin");
  el("signout").textContent = t("signout");
  el("tbSub").textContent = t("desk");
  el("q").placeholder = t("search");
  el("newBtn").textContent = t("newOrder");
  el("refresh").textContent = t("refresh");
  if(STAGES.length){
    var keepS = el("fStatus").value, keepG = el("fStage").value;
    buildFilters();
    el("fStatus").value = keepS; el("fStage").value = keepG;
    draw();
  }
  if(OPEN) openOrder(OPEN.id);
}
el("langBtn").addEventListener("click", function(){
  lang = lang==="ar" ? "en" : "ar";
  localStorage.setItem("els_lang", lang);
  applyLang();
});

/* ================= boot ================= */
applyLang();
trySession();

})();
</script>
